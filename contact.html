<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="styles.css" type="text/css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Contact Us // Jamn Good Jelly!</title>
  </head>

  <body>
    <header id="site-masthead">
      <a href="index.html">
        <img
          src="./images/logo_header_white.png"
          alt="A jar of jam labeled 'Jamn Good Jelly'"
          name="logo"
          class="nav-logo"
      /></a>
      <h1><a href="index.html">Jamn Good Jelly</a></h1>
      <nav id="nav-main">
        <a href="product-list.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <div class="shopping-cart">
          <img
            src="./images/shopping_cart_white.png"
            alt="Shopping cart logo"
            class="shopping-cart-logo"
          />
          <span class="badge">1</span>
        </div>
      </nav>
      <div class="triangle-up"></div>
      <form class="shopping-cart-dropdown">
        <div class="cart-summary">
          <p class="cart-header">Cart</p>
          <div class="total-price">
            <p>Total:</p>
            <p>$35.50</p>
          </div>
          <button class="checkout-btn">Checkout</button>
        </div>
        <div class="cart-item-list">
          <p class="cart-header">Items</p>
          <ul>
          </ul>
        </div>
      </form>
    </header>
    <main id="contact-container">
        <section>
            <h2>Contact Us</h2>
            <p>Have a question or comment, or having trouble with your order? Reach out to us!</p>
        </section>
        <section>
            <ul>
                <li>
                    <h3>Email</h3>
                    <div class="contact-row">
                        <img src="images/email.svg" alt="Email icon">
                        <p>jamngoodjelly@gmail.com</p>
                    </div>
                </li>
                <li>
                    <h3>Phone</h3>
                    <div class="contact-row">
                        <img src="images/phone.svg" alt="Phone icon">
                        <p>(444) 123-4567</p>
                    </div>
                </li>
            </ul>
        </section>
    </main>
  </body>
</html>
