<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="styles.css" type="text/css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Contact Us // Jamn Good Jelly!</title>
  </head>

  <body>
    <header id="site-masthead">
      <a href="index.html">
        <img
          src="./images/logo_header_white.png"
          alt="A jar of jam labeled 'Jamn Good Jelly'"
          name="logo"
          class="nav-logo"
      /></a>
      <h1><a href="index.html">Jamn Good Jelly</a></h1>
      <nav id="nav-main">
        <button class="mobile-menu-btn" onclick="toggleMenu()" type="button" aria-expanded="false" aria-controls="links">
          <img
            src="images/hamburger.svg"
            alt="Menu button"
            aria-label="View site menu"
          />
        </button>
        <div id="links">
          <a href="product-list.html">Products</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <button id="shopping-cart-button" aria-label="View shopping cart contents">
            <img
              src="./images/shopping_cart_white.png"
              alt="Shopping cart logo"
              class="shopping-cart-logo"
            />
          </button>
        </div>
      </nav>
    </header>
    <main id="contact-container">
        <section>
            <h2>Contact Us</h2>
            <p>Have a question or comment, or having trouble with your order? Reach out to us!</p>
        </section>
        <section>
            <ul>
                <li>
                    <h3>Email</h3>
                    <div class="contact-row">
                        <img src="images/email.svg" alt="Email icon">
                        <a href="mailto:jamngoodjelly@gmail.com">jamngoodjelly@gmail.com</a>
                    </div>
                </li>
                <li>
                    <h3>Phone</h3>
                    <div class="contact-row">
                        <img src="images/phone.svg" alt="Phone icon">
                        <a href="tel:+14441234567">(444) 123-4567</a>
                    </div>
                </li>
            </ul>
        </section>
    </main>
  </body>
</html>

<script>
  function toggleMenu() {
    const links = document.getElementById("links");
    const button = document.querySelector(".mobile-menu-btn");
    let linksStyle = getComputedStyle(links)
    if (linksStyle.display === "none") {
      links.style.display = "block";
      button.setAttribute("aria-expanded", "true");
    } else {
      links.style.display = "none";
      button.setAttribute("aria-expanded", "false");
    }
  }
</script>
