<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="styles.css" type="text/css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Products // Jamn Good Jelly!</title>
  </head>

  <body>
    <header id="site-masthead">
      <a href="index.html">
        <img
          src="./images/logo_header_white.png"
          alt="A jar of jam labeled 'Jamn Good Jelly'"
          name="logo"
          class="nav-logo"
      /></a>
      <h1><a href="index.html">Jamn Good Jelly</a></h1>
      <nav id="nav-main" aria-label="Main navigation">
        <button class="mobile-menu-btn" onclick="toggleMenu()" type="button" aria-expanded="false" aria-controls="links" aria-label="Open site menu">
          <img
            src="images/hamburger.svg"
            alt="Menu button"
            aria-label="View site menu"
          />
        </button>
        <div id="links">
          <a href="product-list.html">Products</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <button id="shopping-cart-button" aria-label="View shopping cart contents">
            <img
              src="./images/shopping_cart_white.png"
              alt="Shopping cart logo"
              class="shopping-cart-logo"
            />
          </button>
        </div>
      </nav>
    </header>
    <main id="products-page">
      <h2>Our Products</h2>
      <div class="grid-container">
        <article>
            <img
              src="images/blackberry.jpg"
              alt="A jar of blackberry jam"
            />
            <h3 class="product-name">Blackberry Jam</h3>
        </article>
        <article>
            <img
              src="images/raspberry.jpg"
              alt="A jar of raspberry jam"
            />
              <h3 class="product-name">Raspberry Jam</h3>
        </article>
        <article>
            <img
              src="images/blueberry.jpg"
              alt="A jar of blueberry jam"
            />
              <h3 class="product-name">Blueberry Jam</h3>
        </article>
        <article>
            <img
              src="images/strawberry.jpg"
              alt="A jar of strawberry jam"
            />
              <h3 class="product-name">Strawberry Jam</h3>
        </article>
        <article>
            <img
              src="images/peach.jpg"
              alt="A jar of peach jam"
            />
              <h3 class="product-name">Peach Jam</h3>
        </article>
        <article>
            <img
              src="images/pear.jpg"
              alt="A jar of pear jam"
            />
              <h3 class="product-name">Pear Jam</h3>
        </article>
      </div>
      <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Product image preview">
        <span class="close" onclick="closeImage()">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>
    </main>
  </body>
</html>

<script>

  function toggleMenu() {
    const links = document.getElementById("links");
    const button = document.querySelector(".mobile-menu-btn");
    let linksStyle = getComputedStyle(links)
    if (linksStyle.display === "none") {
      links.style.display = "block";
      button.setAttribute("aria-expanded", "true");
    } else {
      links.style.display = "none";
      button.setAttribute("aria-expanded", "false");
    }
  }

  grid = document.querySelector('.grid-container');
  grid.addEventListener('click', (e) => {
    el = e.target;
    if (el.tagName == 'IMG') {
      image = el.getAttribute('src');
      expandImage(image);
    }
  });

  document.addEventListener('keydown', (e) => {
    imageModalDisplay = document.getElementById("imageModal").style.display;

    // Lets users close the image using just their keyboard (useful for screenreaders)
    if (e.keyCode == 27 && imageModalDisplay == "flex") {
        closeImage();
    }
  });

  function expandImage(image) {
    document.getElementById("modalImage").src = image;
    document.getElementById("imageModal").style.display = "flex";
  }

  function closeImage() {
      document.getElementById("imageModal").style.display = "none";
  }
</script>
