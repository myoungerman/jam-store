<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="styles.css" type="text/css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Product Details // Jamn Good Jelly!</title>
  </head>
  <body>
    <header id="site-masthead">
      <a href="index.html">
        <img
          src="./images/logo_header_white.png"
          alt="A jar of jam labeled 'Jamn Good Jelly'"
          name="logo"
          class="nav-logo"
      /></a>
      <h1><a href="index.html">Jamn Good Jelly</a></h1>
      <nav id="nav-main" aria-label="Main navigation">
        <button class="mobile-menu-btn" onclick="toggleMenu()" type="button" aria-expanded="false" aria-controls="links">
          <img
            src="images/hamburger.svg"
            alt="Menu button"
            aria-label="View site menu"
          />
        </button>
        <div id="links">
          <a href="product-list.html">Products</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <button id="shopping-cart-button" aria-label="View shopping cart contents">
            <img
              src="./images/shopping_cart_white.png"
              alt="Shopping cart logo"
              class="shopping-cart-logo"
            />
          </button>
        </div>
      </nav>
    </header>
    <div id="product-page-container">
      <div id="product-page-image">
        <img
          src="https://via.placeholder.com/330x330.png"
          alt="An image of a product."
          />
      </div>
      <div id="product-page-description">
        <h2 class="product-page-header">{%PRODUCTNAME%}</h2>
        <p>{%PRODUCTDESCRIPTION%}</p>
        <div id="product-page-size">
          <p>Size:</p>
          <select name="size" id="product-size-list">
            <option value="8">8 oz ($12.00)</option>
            <option value="12">12 oz ($14.00)</option>
          </select>
        </div>
        <div id="product-page-quantity">
          <p>Quantity:</p>
          <button type="button" class="adj-btn dec">-</button>
          <input type="text" id="product-quantity-input" name="quantity" />
          <button type="button" class="adj-btn inc">+</button>
        </div>
        <button type="button" id="product-page-cart-btn">Add to cart</button>
      </div>
    </div>
  </body>
</html>
